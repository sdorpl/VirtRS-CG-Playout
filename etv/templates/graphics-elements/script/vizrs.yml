# VizRS graphics for ErsatzTV (VirtRS CG Playout).
# Copy to <ErsatzTV config>/templates/graphics-elements/script/ and add the
# element "VizRS" to the channel's Deco (Graphics Elements).
# Change "channel=1" per channel when several channels share one sidecar.
# "&render=720p" renders the graphics at 720p and scales them to the channel
# (less CPU for animations, softer text); default: the channel size.
# "&area=1920x140+0+930" (WxH+X+Y): only that part of the channel carries
# graphics (here a ticker strip); Chromium draws and ffmpeg overlays only it,
# everything outside is cut off. Several areas comma-separated, e.g. a ticker
# and a logo: "&area=1920x140+0+930,160x160+1690+30". Default: the whole channel.
name: VizRS
command: /vizrs/vizrs-etv-client
args:
  - http://cg:7700/etv?channel=1
z_index: 100
# Current and next programmes from the guide: {next_title}, {next_start}.
epg_entries: 3
start_seconds: 0
# The element ends with the item; this only has to be longer than any item.
duration_seconds: 172800
pixel_format: rgba
format: packet

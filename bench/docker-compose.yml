# Engine benchmark: Chromium vs WPE WebKit on the same page (docs/DOKUMENTACJA.md §8).
#
#   docker compose -f bench/docker-compose.yml up --build
#   Portainer: Stacks → Add stack → Repository, compose path bench/docker-compose.yml
#
#   Report  http://<server>:7790/   (about 5 min with the defaults)
#
# Restart the container to measure again; remove the stack when done.

services:
  bench:
    build:
      context: ..
      dockerfile: bench/Dockerfile
    image: virtrs-cg-bench:local
    # One measurement; the container stays up only to serve the report.
    restart: "no"
    init: true
    environment:
      BENCH_ENGINES: ${BENCH_ENGINES:-chromium,wpe}
      # static, animated; "url" adds BENCH_URL (e.g. VizRS /output with graphics on air).
      BENCH_SCENES: ${BENCH_SCENES:-}
      BENCH_URL: ${BENCH_URL:-}
      BENCH_SIZE: ${BENCH_SIZE:-1920x1080}
      BENCH_FPS: ${BENCH_FPS:-25}
      BENCH_WARMUP: ${BENCH_WARMUP:-10}
      BENCH_DURATION: ${BENCH_DURATION:-60}
    # Chromium renders through /dev/shm, as the sidecar.
    shm_size: 512mb
    volumes:
      - bench-results:/results
    ports:
      - "${BENCH_PORT:-7790}:7790"

volumes:
  bench-results:

# Sidecar benchmark on the target machine (DOKUMENTACJA §8):
#
#   docker compose -f bench/docker-compose.yml -p virtrs-bench up --build
#
# Results go to the log (a table and one JSON line); the container then exits.

services:
  bench:
    build:
      context: ..
      dockerfile: bench/Dockerfile
    image: virtrs-cg-bench:local
    restart: "no"
    # Chromium renders through /dev/shm; the Docker default of 64 MB is too small.
    shm_size: 512mb
    environment:
      BENCH_SIZE: ${BENCH_SIZE:-1920x1080}
      BENCH_MODES: ${BENCH_MODES:-etv,ffmpeg}
      BENCH_SCENE: ${BENCH_SCENE:-animated}
      BENCH_URL: ${BENCH_URL:-}
      BENCH_FPS: ${BENCH_FPS:-25}
      BENCH_FFMPEG_FPS: ${BENCH_FFMPEG_FPS:-50}
      BENCH_WARMUP: ${BENCH_WARMUP:-10}
      BENCH_DURATION: ${BENCH_DURATION:-30}
      BENCH_CAPTURE: ${BENCH_CAPTURE:-screencast}
      BENCH_MAX_FPS: ${BENCH_MAX_FPS:-0}
      BENCH_RENDER: ${BENCH_RENDER:-}

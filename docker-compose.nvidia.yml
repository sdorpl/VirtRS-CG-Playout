# NVIDIA NVENC for ErsatzTV (needs the NVIDIA driver and NVIDIA Container Toolkit on the host):
#
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#
# Then in ErsatzTV: Settings → FFmpeg Profiles → Hardware Acceleration: Nvidia.
# Only ErsatzTV uses the GPU; the sidecar's Chromium stays on the CPU.
#
# The GPU is passed through CDI (/var/run/cdi/nvidia.yaml, generated by the toolkit),
# so Docker needs no "nvidia" runtime. Check: nvidia-ctk cdi list.

services:
  ersatztv:
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              # all, an index (0) or a UUID (GPU-…), as listed by nvidia-ctk cdi list.
              device_ids: ["nvidia.com/gpu=${NVIDIA_GPU:-all}"]
              capabilities: [gpu]

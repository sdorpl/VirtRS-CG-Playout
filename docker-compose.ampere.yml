# Oracle Cloud Ampere A1 (arm64, no GPU, e.g. the free 4 OCPU / 24 GB shape):
#
#   docker compose -f docker-compose.yml -f docker-compose.ampere.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ampere.yml up -d
#
# The sidecar image (amd64 + arm64) comes from CI (tags v*). Without a
# published image, add --build to `up`: it builds on the A1 itself.
# There is no hardware encoder, so ErsatzTV encodes with libx264 on the CPU
# (FFmpeg profile: Hardware Acceleration None). The next streaming engine
# ignores the profile's preset (x264 would run at medium, too slow here), so
# the ffmpeg overlay sets it: VIZRS_FFMPEG_PRESET, veryfast by default
# (superfast for several channels, 1080p50/60 media or a continuous ticker).
#
# CPU split for 4 OCPUs: the sidecar (Chromium, PNG decode, scaling) is
# capped so ffmpeg keeps most of the cores. With the ffmpeg overlay ffmpeg
# waits for the graphics frames: a sidecar starved by a continuous animation
# (a ticker) slows the whole channel below real time, so it gets 2 CPUs.
# Scale the numbers with the shape (CG_CPUS, ...).

services:
  vizrs:
    platform: linux/arm64
    cpus: ${VIZRS_CPUS:-0.5}

  cg:
    image: ${CG_IMAGE:-ghcr.io/sdorpl/virtrs-cg:latest}
    platform: linux/arm64
    cpus: ${CG_CPUS:-2}
    mem_limit: ${CG_MEMORY:-2g}
    environment:
      # Chromium: software raster on fewer threads.
      VIZRS_BROWSER_ARGS: ${VIZRS_BROWSER_ARGS:---num-raster-threads=2 --disable-smooth-scrolling}
      # A1 cores are slower per thread than x86: a little more player buffer.
      LEAD_SECONDS: ${LEAD_SECONDS:-5}

  ersatztv:
    platform: linux/arm64
    # Higher CPU priority than the graphics when the cores are busy.
    cpu_shares: 2048
    environment:
      VIZRS_FFMPEG_PRESET: ${VIZRS_FFMPEG_PRESET:-veryfast}
    tmpfs: !override
      # HLS segments in RAM (24 GB on the free shape); keeps the boot volume idle.
      - /transcode:size=${TRANSCODE_TMPFS:-4g}

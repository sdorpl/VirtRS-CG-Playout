# Obraz sidecara z rendererem natywnym: ghcr.io/<właściciel>/virtrs-cg:render-native (amd64 + arm64)
# oraz render-native-amd64 i render-native-arm64. Każda architektura buduje natywnie na swoim
# runnerze (bez QEMU), vizrs-render z tej samej gałęzi VizRS CG System.
name: Obraz render-native

on:
  push:
    branches: [render-native]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/VizRS-CG-System
          ref: render-native
          path: .vizrs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nazwa obrazu
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/virtrs-cg" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.render
          build-contexts: vizrs-render=.vizrs/source/render
          platforms: linux/${{ matrix.arch }}
          push: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          tags: ${{ steps.img.outputs.name }}:render-native-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wspólny tag obu architektur
        run: |
          name="ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/virtrs-cg"
          docker buildx imagetools create -t "$name:render-native" "$name:render-native-amd64" "$name:render-native-arm64"

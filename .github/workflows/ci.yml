name: CI
# Testy przy każdym wypchnięciu i PR, binarka jako artefakt.
# Obraz sidecara i wydanie: release.yml (znacznik v* albo ręcznie).
on:
  push:
    branches: [main, rust-edit]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Chromium z obrazu runnera, bez piaskownicy (AppArmor w Ubuntu 24.04), jak w obrazie Dockera.
      VIZRS_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: virtrs-cg-linux-x86_64
          path: target/release/virtrs-cg
      # Testy kontraktu: binarka jako czarna skrzynka, udawany VizRS, klienty Pythona.
      - uses: actions/setup-node@v4
        with:
          node-version: current
      - run: npm test

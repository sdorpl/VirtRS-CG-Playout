name: CI
# Testy przy każdym wypchnięciu i PR; obraz sidecara (amd64 + arm64) po znaczniku v*
# (np. v0.2.0) albo ręcznie: ghcr.io/<właściciel>/virtrs-cg:<wersja> i :latest.
# Ampere A1 pobiera gotowy obraz zamiast budować go na sobie.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium z obrazu runnera: testy prawdziwego przechwytywania też idą.
      - run: npm test

  docker:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nazwa obrazu
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/virtrs-cg" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            ${{ steps.img.outputs.name }}:latest

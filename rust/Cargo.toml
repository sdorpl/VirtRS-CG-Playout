[package]
name = "virtrs-cg"
version = "2.0.6"
edition = "2024"
rust-version = "1.87"
description = "VizRS graphics for ErsatzTV channels: commands on clip start and burn-in of /output"
publish = false

[[bin]]
name = "virtrs-cg"
path = "src/main.rs"

[dependencies]
png = "0.18.1"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }

[profile.release]
opt-level = 3
lto = true
strip = true
